<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Offline — Unbreakable Fitness AU</title>
    <meta name="theme-color" content="#0e0e0f" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/images/app-icon-180.png" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e0e0f;
        --card: #1b1a1c;
        --border: #2f2d30;
        --fg: #f2f1ef;
        --muted: #a09da2;
        --primary: #e23a26;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body {
        display: flex;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        padding: calc(1.5rem + env(safe-area-inset-top)) 1.25rem
          calc(1.5rem + env(safe-area-inset-bottom));
        background-image: radial-gradient(
          ellipse at top,
          rgba(226, 58, 38, 0.16),
          transparent 62%
        );
      }
      main {
        width: 100%;
        max-width: 26rem;
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        background: var(--card);
        padding: 2rem 1.75rem;
        text-align: center;
      }
      .mark {
        width: 64px;
        height: 64px;
        border-radius: 0.75rem;
        display: block;
        margin: 0 auto 1.25rem;
      }
      .eyebrow {
        margin: 0;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 0.66rem;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--primary);
      }
      h1 {
        margin: 0.6rem 0 0;
        font-size: 1.5rem;
        line-height: 1.15;
        letter-spacing: -0.01em;
        text-transform: uppercase;
      }
      p {
        margin: 0.85rem 0 0;
        font-size: 0.9rem;
        line-height: 1.6;
        color: var(--muted);
      }
      button {
        margin-top: 1.5rem;
        width: 100%;
        min-height: 44px;
        border: 0;
        border-radius: 0.5rem;
        background: linear-gradient(135deg, #f04a2f, #c22a1a);
        color: #fff;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        class="mark"
        src="/assets/images/app-icon-192.png"
        alt="Unbreakable Fitness AU"
        width="64"
        height="64"
      />
      <p class="eyebrow">// Offline</p>
      <h1>You&rsquo;re off the grid</h1>
      <p>
        Unbreakable can&rsquo;t reach the gym right now. Your saved shell is
        still here — reconnect and try again.
      </p>
      <button type="button" onclick="window.location.reload()">
        Try again
      </button>
    </main>
  </body>
</html>
